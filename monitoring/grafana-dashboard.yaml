# Day 9 — Grafana picks this up automatically (sidecar watches label grafana_dashboard=1)
apiVersion: v1
kind: ConfigMap
metadata:
  name: phoenix-grafana-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  phoenix-overview.json: |
    {
      "uid": "phoenix-overview",
      "title": "Phoenix \u2014 Application & Deployment Health",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "tags": [
        "phoenix",
        "gitops"
      ],
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {}
          },
          {
            "name": "namespace",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": "label_values(phoenix_app_info, namespace)",
            "includeAll": true,
            "multi": true,
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "refresh": 2
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Requests / sec",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(rate(phoenix_http_requests_total{namespace=~\"$namespace\"}[1m]))",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "5xx error ratio",
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(rate(phoenix_http_requests_total{namespace=~\"$namespace\",status=~\"5..\"}[1m])) / sum(rate(phoenix_http_requests_total{namespace=~\"$namespace\"}[1m]))",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "API pods up",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(up{namespace=~\"$namespace\",job=~\".*phoenix-backend.*\"})",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Versions live",
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "count(count by (version) (phoenix_app_info{namespace=~\"$namespace\"}))",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Request rate by status",
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum by (status) (rate(phoenix_http_requests_total{namespace=~\"$namespace\"}[1m]))",
              "legendFormat": "{{status}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Request rate by version (canary vs stable)",
          "gridPos": {
            "x": 12,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum by (version) (rate(phoenix_http_requests_total{namespace=~\"$namespace\"}[1m]))",
              "legendFormat": "{{version}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "5xx ratio by pod-template-hash (what the canary analysis sees)",
          "gridPos": {
            "x": 0,
            "y": 12,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum by (rollouts_pod_template_hash) (rate(phoenix_http_requests_total{namespace=~\"$namespace\",status=~\"5..\"}[1m])) / sum by (rollouts_pod_template_hash) (rate(phoenix_http_requests_total{namespace=~\"$namespace\"}[1m]))",
              "legendFormat": "{{rollouts_pod_template_hash}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Average latency by endpoint",
          "gridPos": {
            "x": 12,
            "y": 12,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum by (path) (rate(phoenix_http_request_duration_seconds_sum{namespace=~\"$namespace\"}[1m])) / sum by (path) (rate(phoenix_http_request_duration_seconds_count{namespace=~\"$namespace\"}[1m]))",
              "legendFormat": "{{path}}",
              "refId": "A"
            }
          ]
        }
      ]
    }
