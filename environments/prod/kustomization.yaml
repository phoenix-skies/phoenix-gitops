# Day 5 — prod overlay
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: phoenix-kz-prod
resources:
  - ../base
  - namespace.yaml
images:
  - name: ghcr.io/phoenix-skies/phoenix-backend
    newTag: latest
  - name: ghcr.io/phoenix-skies/phoenix-frontend
    newTag: latest
replicas:
  - name: phoenix-backend
    count: 3
  - name: phoenix-frontend
    count: 3
patches:
  - target: { kind: ConfigMap, name: phoenix-backend-config }
    patch: |-
      - op: replace
        path: /data/APP_ENV
        value: prod
  - target: { kind: Deployment, name: phoenix-backend }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { cpu: 200m, memory: 256Mi }
          limits: { cpu: 500m, memory: 512Mi }
