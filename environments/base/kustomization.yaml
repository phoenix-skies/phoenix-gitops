# Day 5 — reusable base: everything every environment shares.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../apps/database
  - ../../apps/backend
  - ../../apps/frontend
labels:
  - pairs: { app.kubernetes.io/managed-by: argocd }
    includeSelectors: false
# DEV-ONLY convenience so the Kustomize track works on Day 2-5.
# On Day 8 the Helm track replaces this with a SealedSecret (see helm/phoenix).
secretGenerator:
  - name: phoenix-db
    literals: [password=phoenix-dev-only]
generatorOptions:
  disableNameSuffixHash: true
