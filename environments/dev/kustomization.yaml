# Day 5 — dev overlay
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: phoenix-kz-dev
resources:
  - ../base
  - namespace.yaml
images:
  - name: ghcr.io/phoenix-skies/phoenix-backend
    newTag: sha-9c40182
  - name: ghcr.io/phoenix-skies/phoenix-frontend
    newTag: sha-9c40182
replicas:
  - name: phoenix-backend
    count: 1
  - name: phoenix-frontend
    count: 1
patches:
  - target: {kind: ConfigMap, name: phoenix-backend-config}
    patch: |-
      - op: replace
        path: /data/APP_ENV
        value: dev
  - target: {kind: Deployment, name: phoenix-backend}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { cpu: 50m, memory: 96Mi }
          limits: { cpu: 500m, memory: 512Mi }
