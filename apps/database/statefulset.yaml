apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: phoenix-db
  labels: { app.kubernetes.io/name: phoenix-db, app.kubernetes.io/part-of: phoenix }
spec:
  serviceName: phoenix-db
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: phoenix-db }
  template:
    metadata:
      labels: { app.kubernetes.io/name: phoenix-db, app.kubernetes.io/part-of: phoenix }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ name: pg, containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: phoenix }
            - { name: POSTGRES_USER, value: phoenix }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: phoenix-db, key: password } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          readinessProbe: { exec: { command: ["pg_isready", "-U", "phoenix"] }, periodSeconds: 5 }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 1Gi } }
