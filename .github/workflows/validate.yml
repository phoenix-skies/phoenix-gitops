# Every change to desired state is validated BEFORE it can be merged (Day 8 governance).
name: validate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  render-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: Helm lint
        run: for env in dev qa prod; do helm lint helm/phoenix -f helm/phoenix/values.yaml -f helm/phoenix/values-$env.yaml; done
      - name: Render Helm + Kustomize and validate schemas
        run: |
          mkdir -p out
          for env in dev qa prod; do
            helm template phoenix helm/phoenix -n phoenix-$env -f helm/phoenix/values.yaml -f helm/phoenix/values-$env.yaml > out/helm-$env.yaml
            kubectl kustomize environments/$env > out/kz-$env.yaml
          done
          kubeconform -strict -summary -ignore-missing-schemas \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            out/*.yaml argocd/ applicationsets/ monitoring/
      - name: Prod must use immutable image references
        run: |
          if grep -E 'tag: *(latest|"latest")' helm/phoenix/values-prod.yaml; then
            echo "::warning::values-prod.yaml still uses 'latest'. Promote a sha-...@sha256 reference before go-live."
          fi
