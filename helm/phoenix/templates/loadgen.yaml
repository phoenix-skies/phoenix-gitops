{{- if .Values.loadgen.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phoenix-loadgen
  labels: {{- include "phoenix.labels" . | nindent 4 }}
    app.kubernetes.io/name: phoenix-loadgen
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: phoenix-loadgen }
  template:
    metadata:
      labels: { app.kubernetes.io/name: phoenix-loadgen }
    spec:
      containers:
        - name: curl
          image: curlimages/curl:8.10.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                curl -s -o /dev/null http://phoenix-backend:8080/api/products
                sleep {{ divf 1.0 .Values.loadgen.requestsPerSecond }}
              done
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { cpu: 50m, memory: 32Mi }
{{- end }}
