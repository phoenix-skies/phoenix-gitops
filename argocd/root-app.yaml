# Day 6 — App of Apps. This one Application manages everything in applicationsets/:
# the Helm ApplicationSet (dev/qa/prod) and the monitoring app.
#   kubectl apply -f argocd/project.yaml -f argocd/root-app.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: phoenix-root
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://github.com/phoenix-skies/phoenix-gitops.git
    targetRevision: main
    path: applicationsets
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
